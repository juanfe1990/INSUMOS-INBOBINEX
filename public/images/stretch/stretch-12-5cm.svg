<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Studio Radial Light -->
    <radialGradient id="studioLight12" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F3F6F4"/>
      <stop offset="100%" stop-color="#E1E7E3"/>
    </radialGradient>

    <!-- Translucent Clear Film Body Gradient (Realistic Multi-Stop Polyethylene) -->
    <linearGradient id="filmBodyGrad12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AFC0B4" stop-opacity="0.9"/>
      <stop offset="8%" stop-color="#DCE5DF" stop-opacity="0.95"/>
      <stop offset="22%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="38%" stop-color="#E2EBE5" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#CAD7CE" stop-opacity="0.88"/>
      <stop offset="85%" stop-color="#9FB2A5" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#55695C" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Top Coiled Film Surface Gradient -->
    <radialGradient id="topFilmGrad12" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E4EBE6"/>
      <stop offset="50%" stop-color="#D0DDD4"/>
      <stop offset="85%" stop-color="#B1C3B7"/>
      <stop offset="100%" stop-color="#8DA193"/>
    </radialGradient>

    <!-- Kraft Paperboard Core Tube Bevel (Thickness) -->
    <linearGradient id="kraftRimGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D7B8"/>
      <stop offset="35%" stop-color="#CCA978"/>
      <stop offset="70%" stop-color="#AF8C58"/>
      <stop offset="100%" stop-color="#DBC5A0"/>
    </linearGradient>

    <!-- Deep Inner Core Cavity Shadow -->
    <linearGradient id="coreHoleGrad12" x1="40%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#2D1F0E"/>
      <stop offset="40%" stop-color="#191007"/>
      <stop offset="100%" stop-color="#0A0602"/>
    </linearGradient>

    <!-- Film Tail Translucent Sheen -->
    <linearGradient id="tailGrad12" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#EAF1EC" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B2C5B8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Specular Reflection Filter for Crisp Sheen -->
    <filter id="softGlow12" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="floorShadowBlur12" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="contactShadowBlur12" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Studio Background Plate -->
  <rect width="500" height="500" rx="28" fill="url(#studioLight12)"/>
  
  <!-- Subtle Industrial Grid Watermark -->
  <g stroke="#3F8346" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="125" x2="500" y2="125"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="375" x2="500" y2="375"/>
    <line x1="125" y1="0" x2="125" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="375" y1="0" x2="375" y2="500"/>
  </g>

  <!-- Ground Diffuse Drop Shadow -->
  <ellipse cx="250" cy="405" rx="150" ry="24" fill="#1C2E24" opacity="0.18" filter="url(#floorShadowBlur12)"/>
  <!-- Ground Tight Contact Occlusion Shadow -->
  <ellipse cx="250" cy="385" rx="118" ry="14" fill="#0E1A13" opacity="0.45" filter="url(#contactShadowBlur12)"/>

  <!-- ================= ROLL ASSEMBLY (12.5 cm Mini Roll) ================= -->
  <g id="stretchRoll12">
    <!-- Unwrapped Film Tail (Translucent wrap extension) -->
    <path d="M 360,350 C 405,335 440,360 455,340 C 440,380 395,385 345,365 Z" 
          fill="url(#tailGrad12)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.6"/>
    <path d="M 360,350 Q 420,335 455,340" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8" fill="none"/>

    <!-- Bottom Rim (Base curve) -->
    <ellipse cx="250" cy="365" rx="115" ry="30" fill="#75887B" opacity="0.6"/>

    <!-- Roll Cylinder Body (Height = 105px) -->
    <path d="M 135,260 L 135,365 A 115,30 0 0,0 365,365 L 365,260 A 115,30 0 0,1 135,260 Z" 
          fill="url(#filmBodyGrad12)"/>

    <!-- Subtle Horizontal Film Winding Micro-Layers -->
    <path d="M 135,285 A 115,30 0 0,0 365,285" stroke="#FFFFFF" stroke-width="0.7" stroke-opacity="0.4" fill="none"/>
    <path d="M 135,310 A 115,30 0 0,0 365,310" stroke="#3F8346" stroke-width="0.5" stroke-opacity="0.25" fill="none"/>
    <path d="M 135,335 A 115,30 0 0,0 365,335" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.4" fill="none"/>

    <!-- Primary Vertical Specular Light Beam (Studio Softbox Sheen) -->
    <rect x="175" y="260" width="22" height="106" fill="#FFFFFF" opacity="0.75" filter="url(#softGlow12)"/>
    <rect x="180" y="260" width="8" height="106" fill="#FFFFFF" opacity="0.95"/>

    <!-- Secondary Soft Fill Light -->
    <rect x="235" y="260" width="14" height="106" fill="#FFFFFF" opacity="0.25"/>
    
    <!-- Right Dark Occlusion Edge Gradient -->
    <path d="M 335,260 L 335,365 A 115,30 0 0,0 365,365 L 365,260 Z" fill="#3D4F43" opacity="0.35"/>

    <!-- TOP SURFACE: Wound Coils of Plastic Film -->
    <ellipse cx="250" cy="260" rx="115" ry="30" fill="url(#topFilmGrad12)" stroke="#9EB0A4" stroke-width="0.5"/>
    <!-- Concentric winding coil rings -->
    <ellipse cx="250" cy="260" rx="100" ry="26" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.6"/>
    <ellipse cx="250" cy="260" rx="86" ry="22.5" fill="none" stroke="#7A8D80" stroke-width="0.6" stroke-opacity="0.5"/>
    <ellipse cx="250" cy="260" rx="72" ry="19" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.6"/>
    <ellipse cx="250" cy="260" rx="59" ry="15.5" fill="none" stroke="#687B6E" stroke-width="0.7" stroke-opacity="0.4"/>

    <!-- CARDBOARD CORE (Outer Wall Thickness Bevel) -->
    <ellipse cx="250" cy="260" rx="52" ry="13.5" fill="url(#kraftRimGrad12)" stroke="#7C5D30" stroke-width="0.5"/>
    
    <!-- CARDBOARD CORE HOLE (Deep Hollow Cylinder) -->
    <ellipse cx="250" cy="260" rx="40" ry="10.5" fill="url(#coreHoleGrad12)"/>

    <!-- Core Inner Depth Highlight -->
    <path d="M 215,260 A 40,10.5 0 0,0 285,260" stroke="#7D5C2E" stroke-width="1.2" stroke-opacity="0.8" fill="none"/>
    <ellipse cx="250" cy="260" rx="39" ry="10" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Top Rim Gloss Edge Reflection -->
    <path d="M 140,260 A 115,30 0 0,0 360,260" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.7" fill="none"/>
  </g>

  <!-- Modern Dimension & Quality Badges -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="135" height="42" rx="21" fill="#3F8346" filter="drop-shadow(0 4px 8px rgba(63,131,70,0.3))"/>
    <text x="67" y="26" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="17" letter-spacing="0.5">12.5 cm</text>
  </g>

  <g transform="translate(325, 35)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#2E4040" filter="drop-shadow(0 4px 8px rgba(46,64,64,0.25))"/>
    <text x="70" y="26" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="0.3">Mini Roll</text>
  </g>

  <!-- Height Dimension Callout with Clean Arrowheads -->
  <g transform="translate(85, 260)">
    <line x1="0" y1="0" x2="0" y2="105" stroke="#3F8346" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="0,0 -4,9 4,9" fill="#3F8346"/>
    <polygon points="0,105 -4,96 4,96" fill="#3F8346"/>
    <rect x="-38" y="38" width="48" height="26" rx="6" fill="#FFFFFF" stroke="#3F8346" stroke-width="1.5"/>
    <text x="-14" y="55" text-anchor="middle" fill="#2E4040" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11">12.5 cm</text>
  </g>
</svg>
