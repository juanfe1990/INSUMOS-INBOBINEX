<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7F5"/>
      <stop offset="100%" stop-color="#E2E8E4"/>
    </linearGradient>
    <linearGradient id="filmGrad12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8CDC9" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#A5B5A8" stop-opacity="0.75"/>
      <stop offset="90%" stop-color="#3F8346" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2E4040" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="coreGrad12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBB284"/>
      <stop offset="50%" stop-color="#E5D3B3"/>
      <stop offset="100%" stop-color="#9C8052"/>
    </linearGradient>
    <filter id="shadow12" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#2E4040" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="24" fill="url(#bgGrad12)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M 0,100 L 500,100 M 0,200 L 500,200 M 0,300 L 500,300 M 0,400 L 500,400 M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500" stroke="#3F8346" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Roll Shadow -->
  <ellipse cx="250" cy="420" rx="130" ry="22" fill="#2E4040" opacity="0.15" filter="blur(8px)"/>

  <!-- Center Roll 12.5 cm (narrow height, 90px) -->
  <g transform="translate(0, 70)" filter="url(#shadow12)">
    <!-- Core Inner Cylinder Top -->
    <ellipse cx="250" cy="180" rx="110" ry="30" fill="url(#filmGrad12)"/>
    <ellipse cx="250" cy="180" rx="60" ry="16" fill="url(#coreGrad12)"/>
    <ellipse cx="250" cy="180" rx="45" ry="12" fill="#6A532C"/>

    <!-- Roll Body (Height = 90px representing 12.5cm) -->
    <path d="M 140,180 L 140,270 A 110,30 0 0,0 360,270 L 360,180 A 110,30 0 0,1 140,180 Z" fill="url(#filmGrad12)"/>
    
    <!-- Highlights & Sheen -->
    <path d="M 180,180 L 180,270" stroke="#FFFFFF" stroke-width="8" opacity="0.7" filter="blur(2px)"/>
    <path d="M 310,180 L 310,270" stroke="#3F8346" stroke-width="4" opacity="0.3"/>

    <!-- Stretch Plastic Tail effect -->
    <path d="M 360,270 Q 410,260 440,290 Q 400,310 340,290" fill="url(#filmGrad12)" opacity="0.5"/>

    <!-- Roll Bottom Rim -->
    <ellipse cx="250" cy="270" rx="110" ry="30" fill="none" stroke="#2E4040" stroke-opacity="0.2" stroke-width="2"/>
  </g>

  <!-- Dimension Badge -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#3F8346"/>
    <text x="65" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="18">12.5 cm</text>
  </g>

  <g transform="translate(330, 40)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#2E4040"/>
    <text x="65" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="15">Mini Roll</text>
  </g>

  <!-- Width Indicator Line -->
  <g transform="translate(80, 200)">
    <line x1="0" y1="50" x2="0" y2="140" stroke="#3F8346" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="0,50 -5,60 5,60" fill="#3F8346"/>
    <polygon points="0,140 -5,130 5,130" fill="#3F8346"/>
    <text x="-15" y="98" text-anchor="middle" fill="#2E4040" font-family="sans-serif" font-weight="bold" font-size="14" transform="rotate(-90 -15 98)">12.5 cm</text>
  </g>
</svg>
