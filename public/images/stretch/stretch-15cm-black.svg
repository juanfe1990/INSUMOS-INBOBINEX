<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Studio Radial Light -->
    <radialGradient id="studioLight15B" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F5F3"/>
      <stop offset="100%" stop-color="#D8DFDA"/>
    </radialGradient>

    <!-- Glossy Black Film Body Gradient -->
    <linearGradient id="filmBodyGrad15B" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121614"/>
      <stop offset="8%" stop-color="#262C28"/>
      <stop offset="22%" stop-color="#545D57"/>
      <stop offset="36%" stop-color="#2A302C"/>
      <stop offset="65%" stop-color="#181B19"/>
      <stop offset="85%" stop-color="#0F1110"/>
      <stop offset="100%" stop-color="#050605"/>
    </linearGradient>

    <!-- Top Coiled Film Surface -->
    <radialGradient id="topFilmGrad15B" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2D3530"/>
      <stop offset="50%" stop-color="#1C211E"/>
      <stop offset="85%" stop-color="#121413"/>
      <stop offset="100%" stop-color="#0B0D0C"/>
    </radialGradient>

    <!-- Kraft Paperboard Core Tube Bevel -->
    <linearGradient id="kraftRimGrad15B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D7B8"/>
      <stop offset="35%" stop-color="#CCA978"/>
      <stop offset="70%" stop-color="#AF8C58"/>
      <stop offset="100%" stop-color="#DBC5A0"/>
    </linearGradient>

    <!-- Deep Inner Core Cavity Shadow -->
    <linearGradient id="coreHoleGrad15B" x1="40%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#2D1F0E"/>
      <stop offset="40%" stop-color="#191007"/>
      <stop offset="100%" stop-color="#0A0602"/>
    </linearGradient>

    <!-- Black Film Tail Sheen -->
    <linearGradient id="tailGrad15B" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1C221F" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#363E39" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F1210" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Specular Gloss Highlight Filter -->
    <filter id="glossGlow15B" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="floorShadowBlur15B" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="contactShadowBlur15B" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Studio Background Plate -->
  <rect width="500" height="500" rx="28" fill="url(#studioLight15B)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1A1D1A" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="500" y2="125"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="375" x2="500" y2="375"/>
    <line x1="125" y1="0" x2="125" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="375" y1="0" x2="375" y2="500"/>
  </g>

  <!-- Ground Diffuse Drop Shadow -->
  <ellipse cx="250" cy="410" rx="145" ry="24" fill="#000000" opacity="0.28" filter="url(#floorShadowBlur15B)"/>
  <!-- Ground Tight Contact Occlusion Shadow -->
  <ellipse cx="250" cy="390" rx="114" ry="14" fill="#000000" opacity="0.65" filter="url(#contactShadowBlur15B)"/>

  <!-- ================= ROLL ASSEMBLY (15 cm Black Roll) ================= -->
  <g id="stretchRoll15B">
    <!-- Unwrapped Black Film Tail -->
    <path d="M 358,355 C 403,340 438,365 455,345 C 440,385 395,390 343,370 Z" 
          fill="url(#tailGrad15B)" stroke="#505A54" stroke-width="1"/>
    <path d="M 358,355 Q 418,340 455,345" stroke="#87958D" stroke-width="1.5" stroke-opacity="0.8" fill="none"/>

    <!-- Bottom Rim -->
    <ellipse cx="250" cy="370" rx="112" ry="29" fill="#050706" opacity="0.8"/>

    <!-- Roll Cylinder Body (Height = 140px) -->
    <path d="M 138,230 L 138,370 A 112,29 0 0,0 362,370 L 362,230 A 112,29 0 0,1 138,230 Z" 
          fill="url(#filmBodyGrad15B)"/>

    <!-- Horizontal Creases -->
    <path d="M 138,265 A 112,29 0 0,0 362,265" stroke="#4F5852" stroke-width="0.7" stroke-opacity="0.4" fill="none"/>
    <path d="M 138,300 A 112,29 0 0,0 362,300" stroke="#000000" stroke-width="0.8" stroke-opacity="0.6" fill="none"/>
    <path d="M 138,335 A 112,29 0 0,0 362,335" stroke="#4F5852" stroke-width="0.7" stroke-opacity="0.4" fill="none"/>

    <!-- Primary Vertical Gloss Glare -->
    <rect x="178" y="230" width="22" height="141" fill="#A4B3AA" opacity="0.6" filter="url(#glossGlow15B)"/>
    <rect x="183" y="230" width="8" height="141" fill="#FFFFFF" opacity="0.8"/>

    <!-- Secondary Soft Fill Light -->
    <rect x="238" y="230" width="14" height="141" fill="#808F86" opacity="0.2"/>
    
    <!-- Right Dark Occlusion Edge -->
    <path d="M 332,230 L 332,370 A 112,29 0 0,0 362,370 L 362,230 Z" fill="#000000" opacity="0.5"/>

    <!-- TOP SURFACE: Wound Black Coils -->
    <ellipse cx="250" cy="230" rx="112" ry="29" fill="url(#topFilmGrad15B)" stroke="#39423C" stroke-width="0.5"/>
    <ellipse cx="250" cy="230" rx="98" ry="25.5" fill="none" stroke="#4A564F" stroke-width="0.8" stroke-opacity="0.6"/>
    <ellipse cx="250" cy="230" rx="84" ry="22" fill="none" stroke="#121614" stroke-width="0.8" stroke-opacity="0.8"/>
    <ellipse cx="250" cy="230" rx="70" ry="18.5" fill="none" stroke="#4A564F" stroke-width="0.8" stroke-opacity="0.6"/>
    <ellipse cx="250" cy="230" rx="57" ry="15" fill="none" stroke="#0E1210" stroke-width="0.8" stroke-opacity="0.7"/>

    <!-- CARDBOARD CORE -->
    <ellipse cx="250" cy="230" rx="50" ry="13" fill="url(#kraftRimGrad15B)" stroke="#7C5D30" stroke-width="0.5"/>
    <ellipse cx="250" cy="230" rx="38" ry="10" fill="url(#coreHoleGrad15B)"/>
    <path d="M 217,230 A 38,10 0 0,0 283,230" stroke="#7D5C2E" stroke-width="1.2" stroke-opacity="0.8" fill="none"/>
    <ellipse cx="250" cy="230" rx="37" ry="9.5" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Top Rim Gloss Reflection -->
    <path d="M 143,230 A 112,29 0 0,0 357,230" stroke="#8A9990" stroke-width="1.6" stroke-opacity="0.7" fill="none"/>
  </g>

  <!-- Badges -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="135" height="42" rx="21" fill="#1C211E" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))"/>
    <text x="67" y="26" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="17" letter-spacing="0.5">15 cm</text>
  </g>

  <g transform="translate(325, 35)">
    <rect x="0" y="0" width="140" height="42" rx="21" fill="#000000" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.35))"/>
    <text x="70" y="26" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="0.3">Stretch Negro</text>
  </g>

  <!-- Height Dimension Callout -->
  <g transform="translate(85, 230)">
    <line x1="0" y1="0" x2="0" y2="140" stroke="#1C211E" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="0,0 -4,9 4,9" fill="#1C211E"/>
    <polygon points="0,140 -4,131 4,131" fill="#1C211E"/>
    <rect x="-38" y="55" width="48" height="26" rx="6" fill="#FFFFFF" stroke="#1C211E" stroke-width="1.5"/>
    <text x="-14" y="72" text-anchor="middle" fill="#1C211E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11">15 cm</text>
  </g>
</svg>
