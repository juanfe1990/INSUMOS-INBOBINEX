<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Studio Radial Light -->
    <radialGradient id="studioLight30B" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F5F3"/>
      <stop offset="100%" stop-color="#D8DFDA"/>
    </radialGradient>

    <!-- Glossy Black Film Body Gradient -->
    <linearGradient id="filmBodyGrad30B" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121614"/>
      <stop offset="8%" stop-color="#262C28"/>
      <stop offset="22%" stop-color="#545D57"/>
      <stop offset="36%" stop-color="#2A302C"/>
      <stop offset="65%" stop-color="#181B19"/>
      <stop offset="85%" stop-color="#0F1110"/>
      <stop offset="100%" stop-color="#050605"/>
    </linearGradient>

    <!-- Top Coiled Film Surface -->
    <radialGradient id="topFilmGrad30B" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2D3530"/>
      <stop offset="50%" stop-color="#1C211E"/>
      <stop offset="85%" stop-color="#121413"/>
      <stop offset="100%" stop-color="#0B0D0C"/>
    </radialGradient>

    <!-- Kraft Paperboard Core Tube Bevel -->
    <linearGradient id="kraftRimGrad30B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D7B8"/>
      <stop offset="35%" stop-color="#CCA978"/>
      <stop offset="70%" stop-color="#AF8C58"/>
      <stop offset="100%" stop-color="#DBC5A0"/>
    </linearGradient>

    <!-- Deep Inner Core Cavity Shadow -->
    <linearGradient id="coreHoleGrad30B" x1="40%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#2D1F0E"/>
      <stop offset="40%" stop-color="#191007"/>
      <stop offset="100%" stop-color="#0A0602"/>
    </linearGradient>

    <!-- Black Film Tail Sheen -->
    <linearGradient id="tailGrad30B" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1C221F" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#363E39" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F1210" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Specular Gloss Highlight Filter -->
    <filter id="glossGlow30B" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="floorShadowBlur30B" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="contactShadowBlur30B" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Studio Background Plate -->
  <rect width="500" height="500" rx="28" fill="url(#studioLight30B)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1A1D1A" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="500" y2="125"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="375" x2="500" y2="375"/>
    <line x1="125" y1="0" x2="125" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="375" y1="0" x2="375" y2="500"/>
  </g>

  <!-- Ground Diffuse Drop Shadow -->
  <ellipse cx="250" cy="435" rx="140" ry="20" fill="#000000" opacity="0.28" filter="url(#floorShadowBlur30B)"/>
  <!-- Ground Tight Contact Occlusion Shadow -->
  <ellipse cx="250" cy="418" rx="102" ry="12" fill="#000000" opacity="0.65" filter="url(#contactShadowBlur30B)"/>

  <!-- ================= ROLL ASSEMBLY (30 cm Black Roll, Height = 230px) ================= -->
  <g id="stretchRoll30B">
    <!-- Unwrapped Black Film Tail -->
    <path d="M 345,395 C 390,380 425,405 452,385 C 438,425 395,430 330,410 Z" 
          fill="url(#tailGrad30B)" stroke="#505A54" stroke-width="1"/>
    <path d="M 345,395 Q 405,380 452,385" stroke="#87958D" stroke-width="1.5" stroke-opacity="0.8" fill="none"/>

    <!-- Bottom Rim (Anchored at Y = 405) -->
    <ellipse cx="250" cy="405" rx="100" ry="25" fill="#050706" opacity="0.8"/>

    <!-- Roll Cylinder Body (Height = 230px) -->
    <path d="M 150,175 L 150,405 A 100,25 0 0,0 350,405 L 350,175 A 100,25 0 0,1 150,175 Z" 
          fill="url(#filmBodyGrad30B)"/>

    <!-- Horizontal Creases -->
    <path d="M 150,225 A 100,25 0 0,0 350,225" stroke="#4F5852" stroke-width="0.7" stroke-opacity="0.4" fill="none"/>
    <path d="M 150,275 A 100,25 0 0,0 350,275" stroke="#000000" stroke-width="0.8" stroke-opacity="0.6" fill="none"/>
    <path d="M 150,325 A 100,25 0 0,0 350,325" stroke="#4F5852" stroke-width="0.7" stroke-opacity="0.4" fill="none"/>
    <path d="M 150,375 A 100,25 0 0,0 350,375" stroke="#000000" stroke-width="0.8" stroke-opacity="0.6" fill="none"/>

    <!-- Primary Vertical Gloss Glare -->
    <rect x="186" y="175" width="22" height="231" fill="#A4B3AA" opacity="0.6" filter="url(#glossGlow30B)"/>
    <rect x="191" y="175" width="8" height="231" fill="#FFFFFF" opacity="0.8"/>

    <!-- Secondary Soft Fill Light -->
    <rect x="242" y="175" width="14" height="231" fill="#808F86" opacity="0.2"/>
    
    <!-- Right Dark Occlusion Edge -->
    <path d="M 324,175 L 324,405 A 100,25 0 0,0 350,405 L 350,175 Z" fill="#000000" opacity="0.5"/>

    <!-- TOP SURFACE: Wound Black Coils -->
    <ellipse cx="250" cy="175" rx="100" ry="25" fill="url(#topFilmGrad30B)" stroke="#39423C" stroke-width="0.5"/>
    <ellipse cx="250" cy="175" rx="87" ry="21.7" fill="none" stroke="#4A564F" stroke-width="0.8" stroke-opacity="0.6"/>
    <ellipse cx="250" cy="175" rx="74" ry="18.5" fill="none" stroke="#121614" stroke-width="0.8" stroke-opacity="0.8"/>
    <ellipse cx="250" cy="175" rx="61" ry="15.2" fill="none" stroke="#4A564F" stroke-width="0.8" stroke-opacity="0.6"/>
    <ellipse cx="250" cy="175" rx="49" ry="12.2" fill="none" stroke="#0E1210" stroke-width="0.8" stroke-opacity="0.7"/>

    <!-- CARDBOARD CORE -->
    <ellipse cx="250" cy="175" rx="44" ry="11" fill="url(#kraftRimGrad30B)" stroke="#7C5D30" stroke-width="0.5"/>
    <ellipse cx="250" cy="175" rx="33" ry="8.2" fill="url(#coreHoleGrad30B)"/>
    <path d="M 220,175 A 33,8.2 0 0,0 280,175" stroke="#7D5C2E" stroke-width="1.2" stroke-opacity="0.8" fill="none"/>
    <ellipse cx="250" cy="175" rx="32" ry="7.8" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Top Rim Gloss Reflection -->
    <path d="M 155,175 A 100,25 0 0,0 345,175" stroke="#8A9990" stroke-width="1.6" stroke-opacity="0.7" fill="none"/>
  </g>

  <!-- Clean Floating Header Badges -->
  <g transform="translate(25, 22)">
    <rect x="0" y="0" width="115" height="36" rx="18" fill="#1C211E" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))"/>
    <text x="57" y="23" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">30 cm</text>
  </g>

  <g transform="translate(360, 22)">
    <rect x="0" y="0" width="115" height="36" rx="18" fill="#000000" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.35))"/>
    <text x="57" y="23" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="0.3">Stretch Negro</text>
  </g>

  <!-- Height Dimension Callout -->
  <g transform="translate(85, 175)">
    <line x1="0" y1="0" x2="0" y2="230" stroke="#1C211E" stroke-width="1.8" stroke-dasharray="3 3"/>
    <polygon points="0,0 -3.5,8 3.5,8" fill="#1C211E"/>
    <polygon points="0,230 -3.5,222 3.5,222" fill="#1C211E"/>
    <rect x="-34" y="100" width="44" height="24" rx="5" fill="#FFFFFF" stroke="#1C211E" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/>
    <text x="-12" y="116" text-anchor="middle" fill="#1C211E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5">30 cm</text>
  </g>
</svg>
