<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Studio Radial Light -->
    <radialGradient id="studioLight45B" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2F5F3"/>
      <stop offset="100%" stop-color="#D8DFDA"/>
    </radialGradient>

    <!-- Glossy Black Film Body Gradient -->
    <linearGradient id="filmBodyGrad45B" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121614"/>
      <stop offset="8%" stop-color="#262C28"/>
      <stop offset="22%" stop-color="#545D57"/>
      <stop offset="36%" stop-color="#2A302C"/>
      <stop offset="65%" stop-color="#181B19"/>
      <stop offset="85%" stop-color="#0F1110"/>
      <stop offset="100%" stop-color="#050605"/>
    </linearGradient>

    <!-- Top Coiled Film Surface -->
    <radialGradient id="topFilmGrad45B" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2D3530"/>
      <stop offset="50%" stop-color="#1C211E"/>
      <stop offset="85%" stop-color="#121413"/>
      <stop offset="100%" stop-color="#0B0D0C"/>
    </radialGradient>

    <!-- Kraft Paperboard Core Tube Bevel -->
    <linearGradient id="kraftRimGrad45B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D7B8"/>
      <stop offset="35%" stop-color="#CCA978"/>
      <stop offset="70%" stop-color="#AF8C58"/>
      <stop offset="100%" stop-color="#DBC5A0"/>
    </linearGradient>

    <!-- Deep Inner Core Cavity Shadow -->
    <linearGradient id="coreHoleGrad45B" x1="40%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#2D1F0E"/>
      <stop offset="40%" stop-color="#191007"/>
      <stop offset="100%" stop-color="#0A0602"/>
    </linearGradient>

    <!-- Black Film Tail Sheen -->
    <linearGradient id="tailGrad45B" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1C221F" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#363E39" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F1210" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Specular Gloss Highlight Filter -->
    <filter id="glossGlow45B" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="floorShadowBlur45B" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="contactShadowBlur45B" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Studio Background Plate -->
  <rect width="500" height="500" rx="28" fill="url(#studioLight45B)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#1A1D1A" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="125" x2="500" y2="125"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="375" x2="500" y2="375"/>
    <line x1="125" y1="0" x2="125" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="375" y1="0" x2="375" y2="500"/>
  </g>

  <!-- Ground Diffuse Drop Shadow -->
  <ellipse cx="250" cy="435" rx="135" ry="18" fill="#000000" opacity="0.28" filter="url(#floorShadowBlur45B)"/>
  <!-- Ground Tight Contact Occlusion Shadow -->
  <ellipse cx="250" cy="418" rx="96" ry="11" fill="#0E1A13" opacity="0.65" filter="url(#contactShadowBlur45B)"/>

  <!-- ================= ROLL ASSEMBLY (45 cm Black Roll, Height = 280px) ================= -->
  <g id="stretchRoll45B">
    <!-- Unwrapped Black Film Tail -->
    <path d="M 338,395 C 383,380 418,405 450,385 C 436,425 392,430 326,410 Z" 
          fill="url(#tailGrad45B)" stroke="#505A54" stroke-width="1"/>
    <path d="M 338,395 Q 398,380 450,385" stroke="#87958D" stroke-width="1.5" stroke-opacity="0.8" fill="none"/>

    <!-- Bottom Rim (Anchored at Y = 405) -->
    <ellipse cx="250" cy="405" rx="92" ry="23" fill="#050706" opacity="0.8"/>

    <!-- Roll Cylinder Body (Height = 280px) -->
    <path d="M 158,125 L 158,405 A 92,23 0 0,0 342,405 L 342,125 A 92,23 0 0,1 158,125 Z" 
          fill="url(#filmBodyGrad45B)"/>

    <!-- Horizontal Creases -->
    <path d="M 158,180 A 92,23 0 0,0 342,180" stroke="#4F5852" stroke-width="0.7" stroke-opacity="0.4" fill="none"/>
    <path d="M 158,235 A 92,23 0 0,0 342,235" stroke="#000000" stroke-width="0.8" stroke-opacity="0.6" fill="none"/>
    <path d="M 158,290 A 92,23 0 0,0 342,290" stroke="#4F5852" stroke-width="0.7" stroke-opacity="0.4" fill="none"/>
    <path d="M 158,345 A 92,23 0 0,0 342,345" stroke="#000000" stroke-width="0.8" stroke-opacity="0.6" fill="none"/>

    <!-- Primary Vertical Gloss Glare -->
    <rect x="190" y="125" width="22" height="281" fill="#A4B3AA" opacity="0.6" filter="url(#glossGlow45B)"/>
    <rect x="195" y="125" width="8" height="281" fill="#FFFFFF" opacity="0.8"/>

    <!-- Secondary Soft Fill Light -->
    <rect x="244" y="125" width="14" height="281" fill="#808F86" opacity="0.2"/>
    
    <!-- Right Dark Occlusion Edge -->
    <path d="M 318,125 L 318,405 A 92,23 0 0,0 342,405 L 342,125 Z" fill="#000000" opacity="0.5"/>

    <!-- TOP SURFACE: Wound Black Coils -->
    <ellipse cx="250" cy="125" rx="92" ry="23" fill="url(#topFilmGrad45B)" stroke="#39423C" stroke-width="0.5"/>
    <ellipse cx="250" cy="125" rx="80" ry="20" fill="none" stroke="#4A564F" stroke-width="0.8" stroke-opacity="0.6"/>
    <ellipse cx="250" cy="125" rx="68" ry="17" fill="none" stroke="#121614" stroke-width="0.8" stroke-opacity="0.8"/>
    <ellipse cx="250" cy="125" rx="56" ry="14" fill="none" stroke="#4A564F" stroke-width="0.8" stroke-opacity="0.6"/>
    <ellipse cx="250" cy="125" rx="45" ry="11.2" fill="none" stroke="#0E1210" stroke-width="0.8" stroke-opacity="0.7"/>

    <!-- CARDBOARD CORE -->
    <ellipse cx="250" cy="125" rx="40" ry="10" fill="url(#kraftRimGrad45B)" stroke="#7C5D30" stroke-width="0.5"/>
    <ellipse cx="250" cy="125" rx="30" ry="7.5" fill="url(#coreHoleGrad45B)"/>
    <path d="M 223,125 A 30,7.5 0 0,0 277,125" stroke="#7D5C2E" stroke-width="1.2" stroke-opacity="0.8" fill="none"/>
    <ellipse cx="250" cy="125" rx="29" ry="7" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Top Rim Gloss Reflection -->
    <path d="M 162,125 A 92,23 0 0,0 338,125" stroke="#8A9990" stroke-width="1.6" stroke-opacity="0.7" fill="none"/>
  </g>

  <!-- Clean Floating Header Badges -->
  <g transform="translate(25, 22)">
    <rect x="0" y="0" width="115" height="36" rx="18" fill="#1C211E" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))"/>
    <text x="57" y="23" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" letter-spacing="0.5">45 cm</text>
  </g>

  <g transform="translate(360, 22)">
    <rect x="0" y="0" width="115" height="36" rx="18" fill="#000000" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.35))"/>
    <text x="57" y="23" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="0.3">Stretch Negro</text>
  </g>

  <!-- Height Dimension Callout -->
  <g transform="translate(85, 125)">
    <line x1="0" y1="0" x2="0" y2="280" stroke="#1C211E" stroke-width="1.8" stroke-dasharray="3 3"/>
    <polygon points="0,0 -3.5,8 3.5,8" fill="#1C211E"/>
    <polygon points="0,280 -3.5,272 3.5,272" fill="#1C211E"/>
    <rect x="-34" y="125" width="44" height="24" rx="5" fill="#FFFFFF" stroke="#1C211E" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/>
    <text x="-12" y="141" text-anchor="middle" fill="#1C211E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5">45 cm</text>
  </g>
</svg>
