<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad50" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7F5"/>
      <stop offset="100%" stop-color="#E2E8E4"/>
    </linearGradient>
    <linearGradient id="filmGrad50" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8CDC9" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#A5B5A8" stop-opacity="0.75"/>
      <stop offset="90%" stop-color="#3F8346" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2E4040" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="coreGrad50" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBB284"/>
      <stop offset="50%" stop-color="#E5D3B3"/>
      <stop offset="100%" stop-color="#9C8052"/>
    </linearGradient>
    <filter id="shadow50" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#2E4040" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bgGrad50)"/>
  <path d="M 0,100 L 500,100 M 0,200 L 500,200 M 0,300 L 500,300 M 0,400 L 500,400 M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500" stroke="#3F8346" stroke-opacity="0.06" stroke-width="1"/>

  <ellipse cx="250" cy="465" rx="100" ry="16" fill="#2E4040" opacity="0.15" filter="blur(8px)"/>

  <!-- Center Roll 50 cm (Height = 320px) -->
  <g transform="translate(0, 0)" filter="url(#shadow50)">
    <ellipse cx="250" cy="65" rx="82" ry="21" fill="url(#filmGrad50)"/>
    <ellipse cx="250" cy="65" rx="45" ry="11" fill="url(#coreGrad50)"/>
    <ellipse cx="250" cy="65" rx="32" ry="7" fill="#6A532C"/>

    <!-- Roll Body (Height = 320px) -->
    <path d="M 168,65 L 168,385 A 82,21 0 0,0 332,385 L 332,65 A 82,21 0 0,1 168,65 Z" fill="url(#filmGrad50)"/>
    
    <path d="M 200,65 L 200,385" stroke="#FFFFFF" stroke-width="8" opacity="0.7" filter="blur(2px)"/>
    <path d="M 295,65 L 295,385" stroke="#3F8346" stroke-width="4" opacity="0.3"/>

    <path d="M 332,385 Q 382,375 412,405 Q 372,425 312,405" fill="url(#filmGrad50)" opacity="0.5"/>
    <ellipse cx="250" cy="385" rx="82" ry="21" fill="none" stroke="#2E4040" stroke-opacity="0.2" stroke-width="2"/>
  </g>

  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#3F8346"/>
    <text x="65" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="18">50 cm</text>
  </g>

  <g transform="translate(330, 40)">
    <rect x="0" y="0" width="130" height="42" rx="21" fill="#2E4040"/>
    <text x="65" y="26" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="15">Industrial</text>
  </g>

  <g transform="translate(105, 65)">
    <line x1="0" y1="0" x2="0" y2="320" stroke="#3F8346" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="0,0 -5,10 5,10" fill="#3F8346"/>
    <polygon points="0,320 -5,310 5,310" fill="#3F8346"/>
    <text x="-15" y="163" text-anchor="middle" fill="#2E4040" font-family="sans-serif" font-weight="bold" font-size="14" transform="rotate(-90 -15 163)">50 cm</text>
  </g>
</svg>
